name: DB rehearsal (VPS)

# Manual only. Restores the live Supabase data into `omoiyari_rehearsal` on the
# VPS, runs the real app against it on the runner, and smoke-tests login +
# every main read path. Production (`omoiyari`) is never named anywhere.
#
# Required repository secrets:
#   SUPABASE_DB_URL     session-mode URL (port 5432), password URL-encoded
#   VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_APP_DIR
#   VPS_DB_PASSWORD     password of the `omoiyari` Postgres role on the VPS
#
# The VPS must already run the `db` service from deploy/compose.yaml.

on:
  workflow_dispatch:
    inputs:
      keep_database:
        description: Keep omoiyari_rehearsal after the run (debugging)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-rehearsal
  cancel-in-progress: false

env:
  TARGET_DB: omoiyari_rehearsal
  TUNNEL_PORT: "55432"

jobs:
  rehearsal:
    name: restore + app smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      # The Supabase CLI dumps with pg_dump 17.11, which emits the `\restrict`
      # psql meta-command. Ubuntu's default client can be older and would fail
      # with "invalid command \restrict", so install the matching major.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          psql --version

      - name: Install Chromium for the smoke test
        run: npx -y playwright@1.63.0 install --with-deps chromium

      # Ephemeral per-run values. The smoke account and the auth secret only
      # exist for this job, so they never need to be stored as secrets.
      - name: Generate ephemeral credentials
        run: |
          {
            echo "SMOKE_PASSWORD=$(openssl rand -hex 16)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Open SSH tunnel to the VPS database
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          ssh -f -N \
            -i "$RUNNER_TEMP/deploy_key" \
            -o StrictHostKeyChecking=accept-new \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -L "127.0.0.1:${TUNNEL_PORT}:127.0.0.1:5432" \
            "${USER}@${HOST}"
          echo "tunnel open on 127.0.0.1:${TUNNEL_PORT}"

      - name: Create a clean rehearsal database
        env:
          REHEARSAL_ADMIN_URL: postgresql://omoiyari:${{ secrets.VPS_DB_PASSWORD }}@127.0.0.1:55432/postgres
        run: node scripts/rehearsal-reset-db.mjs

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: postgresql://omoiyari:${{ secrets.VPS_DB_PASSWORD }}@127.0.0.1:55432/omoiyari_rehearsal
        run: vp run db:migrate

      - name: Bridge the source-only columns and clear seed rows
        env:
          PGPASSWORD: ${{ secrets.VPS_DB_PASSWORD }}
        run: |
          psql -h 127.0.0.1 -p "${TUNNEL_PORT}" -U omoiyari -d "${TARGET_DB}" \
            -v ON_ERROR_STOP=1 -f scripts/sql/rehearsal-before-restore.sql

      - name: Dump the live Supabase data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          vp dlx supabase db dump --data-only -s public \
            --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/supabase-data.sql"
          du -h "$RUNNER_TEMP/supabase-data.sql"

      - name: Restore into the rehearsal database
        env:
          PGPASSWORD: ${{ secrets.VPS_DB_PASSWORD }}
        run: |
          time psql -h 127.0.0.1 -p "${TUNNEL_PORT}" -U omoiyari -d "${TARGET_DB}" \
            -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/supabase-data.sql"

      - name: Drop the bridge columns
        env:
          PGPASSWORD: ${{ secrets.VPS_DB_PASSWORD }}
        run: |
          psql -h 127.0.0.1 -p "${TUNNEL_PORT}" -U omoiyari -d "${TARGET_DB}" \
            -v ON_ERROR_STOP=1 -f scripts/sql/rehearsal-after-restore.sql

      - name: Move recipe images to local disk
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          TARGET_DATABASE_URL: postgresql://omoiyari:${{ secrets.VPS_DB_PASSWORD }}@127.0.0.1:55432/omoiyari_rehearsal
          MEDIA_ROOT: ${{ runner.temp }}/media
          PUBLIC_BASE_URL: http://localhost:3000
        run: node scripts/migrate-recipe-images.mjs

      - name: Compare row counts and check images
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          TARGET_DATABASE_URL: postgresql://omoiyari:${{ secrets.VPS_DB_PASSWORD }}@127.0.0.1:55432/omoiyari_rehearsal
        run: node scripts/verify-restored-db.mjs | tee "$RUNNER_TEMP/verify.json"

      - name: Create the smoke-test account
        env:
          TARGET_DATABASE_URL: postgresql://omoiyari:${{ secrets.VPS_DB_PASSWORD }}@127.0.0.1:55432/omoiyari_rehearsal
          SMOKE_EMAIL: smoke@omoiyari.test
        run: node scripts/smoke/create-smoke-user.mjs

      - name: Build and start the app against the rehearsal database
        env:
          DATABASE_URL: postgresql://omoiyari:${{ secrets.VPS_DB_PASSWORD }}@127.0.0.1:55432/omoiyari_rehearsal
          BETTER_AUTH_URL: http://localhost:3000
          PUBLIC_BASE_URL: http://localhost:3000
          MEDIA_ROOT: ${{ runner.temp }}/media
        run: |
          vp build
          NODE_ENV=production PORT=3000 HOST=127.0.0.1 \
            node .output/server/index.mjs > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app did not start"; tail -100 "$RUNNER_TEMP/app.log"; exit 1

      - name: Smoke test
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: smoke@omoiyari.test
          TARGET_DATABASE_URL: postgresql://omoiyari:${{ secrets.VPS_DB_PASSWORD }}@127.0.0.1:55432/omoiyari_rehearsal
        run: node scripts/smoke/pos-smoke.mjs

      - name: Stop the app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/app.pid" ]; then kill "$(cat "$RUNNER_TEMP/app.pid")" || true; fi

      - name: Drop the rehearsal database
        if: success() && inputs.keep_database == false
        env:
          PGPASSWORD: ${{ secrets.VPS_DB_PASSWORD }}
        run: |
          psql -h 127.0.0.1 -p "${TUNNEL_PORT}" -U omoiyari -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "drop database if exists \"${TARGET_DB}\" with (force)"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-rehearsal-report
          path: |
            smoke-artifacts/
            ${{ runner.temp }}/verify.json
            ${{ runner.temp }}/app.log
          if-no-files-found: ignore

      - name: Close the tunnel
        if: always()
        run: pkill -f "ssh -f -N" || true
