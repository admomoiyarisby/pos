name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main are allowed to finish so an
# in-flight deploy is never interrupted by a newer push.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check (fmt + lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0 # exact release; never the `v1` tag
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - run: vp check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Run tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: vp test run

  # Schema-drift tripwire (Data Penjualan outage, 2026-10-01): a migration
  # committed but never applied to the target DB ships code that SELECTs a
  # column the database doesn't have. The SQL-drift check runs in the `test`
  # job (migrations.integration.test.ts against the local test DB); this job
  # pins the journal itself: every _journal.json entry must have its SQL file
  # present, and every SQL file must be referenced by the journal.
  drift:
    name: migration journal consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - run: node scripts/check-migration-journal.mjs

  # The app is compiled exactly once — here, inside the image build — after the
  # checks above pass. `push` is main-only, so on pull requests this still
  # validates that the app builds, but publishes nothing.
  build:
    name: build image
    needs: [check, test, drift]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          # github.repository must be lowercase for GHCR. admomoiyarisby/pos is.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main only. The VPS never builds; it pulls the image the job above pushed.
  deploy:
    name: deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The deploy job runs on its own fresh runner — without this, the
      # workspace is empty and scp has nothing to archive.
      - uses: actions/checkout@v4

      # Fail early with a clear message if a secret is missing or misnamed,
      # instead of the cryptic "can't connect without a private SSH key".
      - name: Verify deploy secrets
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          fail=0
          for v in HOST USER KEY DIR; do
            val="${!v}"
            if [ -z "$val" ]; then
              echo "::error::$v is empty — add it under Settings → Secrets and variables → Actions → Secrets (repository), not the Variables tab and not an Environment."
              fail=1
            else
              echo "$v: set (${#val} chars)"
            fi
          done
          exit $fail

      # Keep compose.yaml + Caddyfile in sync with main. deploy/.env is NOT
      # copied, so the VPS's real secrets are never overwritten.
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/compose.yaml,deploy/Caddyfile"
          target: ${{ secrets.VPS_APP_DIR }}

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}/deploy"

            # Only needed if the GHCR package is private. Leave GHCR_TOKEN unset
            # when the package is public and this is skipped.
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            docker compose pull app
            docker compose up -d --remove-orphans

            # `Caddyfile` is a *file* bind mount, and a file bind mount pins the
            # inode. scp replaces the file atomically (new inode), so a running
            # container keeps reading the OLD file forever — and `caddy reload`
            # re-reads that same stale copy, reapplies identical config, and
            # exits 0 while changing nothing. Only a fresh container re-resolves
            # the mount, so recreate caddy. Validate the freshly-written file
            # first, so a typo'd config can't take the site down.
            docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker compose up -d --force-recreate caddy

            docker image prune -f
            docker compose ps
